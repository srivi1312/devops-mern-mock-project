services:
  mongo:
    image: mongo:latest
    ports:
      - "8080:27017"

  backend:
    build: './backend'
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI}
    depends_on:
      - mongo

  frontend:
    build: './frontend'
    ports:
      - "3000:3000"
    depends_on:
      - backend
    env_file:
      - ./frontend/.env.prod
  
